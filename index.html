<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KARTRIX-BACKEND</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #e8eefc;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(920px, 100%);
        background: #111936;
        border: 1px solid #22305f;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
      }
      textarea,
      pre {
        width: 100%;
        box-sizing: border-box;
        border-radius: 12px;
        border: 1px solid #2a3a73;
        background: #0b1228;
        color: #e8eefc;
        padding: 14px;
        font: inherit;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      pre {
        min-height: 180px;
        white-space: pre-wrap;
        overflow: auto;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        background: #4f7cff;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #26345f;
      }
      h1 {
        margin-top: 0;
        margin-bottom: 8px;
      }
      p {
        margin-top: 0;
        color: #b9c6e8;
      }
      label {
        display: block;
        margin: 14px 0 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>KARTRIX-BACKEND</h1>
      <p>FastAPI command parser/executor for the DARTRIX blueprint.</p>

      <label for="input">Command</label>
      <textarea id="input" placeholder="Type a command..."></textarea>

      <div class="row">
        <button id="parseBtn">Parse</button>
        <button id="executeBtn" class="secondary">Execute</button>
      </div>

      <label for="output">Response</label>
      <pre id="output">Waiting for input...</pre>
    </div>

    <script>
      const input = document.getElementById("input");
      const output = document.getElementById("output");
      const parseBtn = document.getElementById("parseBtn");
      const executeBtn = document.getElementById("executeBtn");
      let parsedCommand = null;

      function render(value) {
        output.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      async function parseCommand() {
        const text = input.value.trim();
        const response = await fetch("/parse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await response.json();
        parsedCommand = data;
        render(data);
      }

      async function executeCommand() {
        if (!parsedCommand) {
          await parseCommand();
        }
        const response = await fetch("/execute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: parsedCommand })
        });
        const data = await response.json();
        render(data);
      }

      parseBtn.addEventListener("click", () => parseCommand().catch((error) => render(String(error))));
      executeBtn.addEventListener("click", () => executeCommand().catch((error) => render(String(error))));
    </script>
  </body>
</html>
